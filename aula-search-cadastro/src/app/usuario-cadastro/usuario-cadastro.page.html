<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Cadastrar Usuário</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
      <ion-input label="Primeiro Nome" labelPlacement="stacked" formControlName="first_name">
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Sobrenome" labelPlacement="stacked" formControlName="last_name">
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Email" labelPlacement="stacked" formControlName="email">
      </ion-input>
    </ion-item>
    <ion-button (click)="realizarCadastro()">Cadastrar</ion-button>
    <ion-button routerLink="/user-list" color="danger">Cancelar</ion-button>
  </ion-list>
</form>
</ion-content>
