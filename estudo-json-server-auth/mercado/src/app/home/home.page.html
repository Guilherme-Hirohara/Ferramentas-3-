<ion-tabs>
  <ion-header translucent="true">
    <ion-toolbar color="primary">
      <ion-title class="home-title">
        Conveniência Store
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-tab-bar slot="top" class="custom-tab-bar">
    <ion-tab-button tab="Login" [routerLink]="['/login']">
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-label>Login</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="Buy Products">
      <ion-icon name="bag-outline"></ion-icon>
      <ion-label>Comprar</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="Admin" [routerLink]="['/admin']">
      <ion-icon name="lock-closed-outline"></ion-icon>
      <ion-label>Admin</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="Products" [routerLink]="['/admin']">
      <ion-icon name="restaurant-outline"></ion-icon>
      <ion-label>Produtos</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
