<ion-content class="auth-content">
  <div class="auth-wrapper">
    <ion-card class="auth-card">
      <ion-card-header>
        <div class="auth-avatar">
          <ion-icon name="person-add-outline"></ion-icon>
        </div>
        <ion-card-title>Criar Nova Conta</ion-card-title>
        <ion-card-subtitle>Preencha os dados abaixo para se cadastrar</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="forms" (ngSubmit)="registerUser()">
          <ion-list lines="none">
            <div class="name-row">
              <div class="input-field half">
                <ion-input label="Nome" labelPlacement="floating" type="text" fill="outline" formControlName="firstName"></ion-input>
              </div>
              <div class="input-field half">
                <ion-input label="Sobrenome" labelPlacement="floating" type="text" fill="outline" formControlName="lastName"></ion-input>
              </div>
            </div>

            <div class="input-field">
              <ion-input label="Idade" labelPlacement="floating" type="number" fill="outline" formControlName="age"></ion-input>
            </div>

            <div class="input-field">
              <ion-input label="E-mail" labelPlacement="floating" type="email" fill="outline" formControlName="email"></ion-input>
            </div>

            @if(getCargo() == 'Admin'){
              <div class="input-field">
                <ion-input label="Cargo" labelPlacement="floating" type="text" fill="outline" formControlName="cargo"></ion-input>
              </div>
            }

            <div class="input-field">
              <ion-input label="Senha" labelPlacement="floating" type="password" fill="outline" formControlName="password">
                <ion-input-password-toggle slot="end"></ion-input-password-toggle>
              </ion-input>
            </div>

            <div class="input-field">
              <ion-input label="Confirmar Senha" labelPlacement="floating" type="password" fill="outline" [(ngModel)]="confirmPassword" [ngModelOptions]="{standalone: true}">
                <ion-input-password-toggle slot="end"></ion-input-password-toggle>
              </ion-input>
            </div>

            <div class="btn-group">
              <ion-button color="success" type="submit" expand="block">
                Cadastrar
              </ion-button>
              <ion-button color="medium" fill="outline" expand="block" [routerLink]="['/login']">
                Já tenho conta / Voltar
              </ion-button>
            </div>
          </ion-list>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
